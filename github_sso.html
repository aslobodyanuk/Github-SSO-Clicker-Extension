<div class="business-sso text-center">
    <div class="text-left">
        <div id="js-flash-container" class="flash-container" data-turbo-replace="">



            <template class="js-flash-template">

                <div class="flash flash-full   {{ className }}">
                    <div>
                        <button autofocus="" class="flash-close js-flash-close" type="button"
                            aria-label="Dismiss this message">
                            <svg aria-hidden="true" height="16" viewBox="0 0 16 16" version="1.1" width="16"
                                data-view-component="true" class="octicon octicon-x">
                                <path
                                    d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z">
                                </path>
                            </svg>
                        </button>
                        <div aria-atomic="true" role="alert" class="js-flash-alert">

                            <div>{{ message }}</div>

                        </div>
                    </div>
                </div>
            </template>
        </div>

    </div>
    <div class="business-sso-panel">
        <div class="position-relative mt-2 mb-3">
            <img class="avatar mb-3" src="https://avatars.githubusercontent.com/13232323" width="60"
                height="60" alt="Enterprise EMU">

            <h1 class="sso-title m-0">
                Single sign-on to
                <strong>Enterprise EMU</strong>
            </h1>
        </div>


        <p class="color-fg-muted mt-2 mb-4">
            Authenticate your account by logging into
            Enterprise EMU
            single sign-on provider.
        </p>


        <!-- '"` --><!-- </textarea></xmp> -->
        <form data-turbo="false"
            action="https://github.com/enterprises/some_enterprise"
            accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token"
                value="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">

            <input type="hidden" name="add_account" id="add_account" autocomplete="off" class="form-control">

            <button type="submit" data-view-component="true"
                class="Button--primary Button--medium Button Button--fullWidth"> <span class="Button-content">
                    <span class="Button-label">Continue</span>
                </span>
            </button>

        </form>
    </div>



</div>
